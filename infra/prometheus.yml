global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'billing-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:30081', 'billing-worker:8081']

  - job_name: 'mediation-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:30080', 'billing-mediation-service:8080']

  - job_name: 'snapshot-generator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:30082', 'snapshot-generator-service:8082']

  - job_name: 'kafka-lag-exporter'
    static_configs:
      - targets: ['kafka-lag-exporter:8000']
