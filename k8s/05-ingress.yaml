apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evn-billing-ingress
  namespace: evn-billing
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: evn-billing.local
    http:
      paths:
      # Route to Mediation & Batch Orchestrator Service
      - path: /mediation
        pathType: Prefix
        backend:
          service:
            name: billing-mediation-service
            port:
              number: 8080

      # Route to Billing Worker Nodes (Actuator & Metrics)
      - path: /worker
        pathType: Prefix
        backend:
          service:
            name: billing-worker-service
            port:
              number: 8081

      # Route to Snapshot Generator Service (Redis Cache Prewarmer)
      - path: /snapshot
        pathType: Prefix
        backend:
          service:
            name: snapshot-generator-service
            port:
              number: 8082
