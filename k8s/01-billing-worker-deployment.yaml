apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-worker
  namespace: evn-billing
  labels:
    app: billing-worker
    component: compute-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-worker
  template:
    metadata:
      labels:
        app: billing-worker
        component: compute-core
    spec:
      containers:
      - name: billing-worker
        image: billing-worker:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: billing-config
        - secretRef:
            name: billing-secret
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_CONCURRENCY
          value: "4"
        - name: JAVA_OPTS
          value: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:+UseStringDeduplication"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "3Gi"
        ports:
        - containerPort: 8081
          name: http-metrics
        livenessProbe:
          httpGet:
            path: /worker/actuator/health/liveness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /worker/actuator/health/readiness
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: billing-worker-service
  namespace: evn-billing
spec:
  type: NodePort
  selector:
    app: billing-worker
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
    name: http-metrics
