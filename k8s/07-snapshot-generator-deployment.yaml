apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-generator
  namespace: evn-billing
  labels:
    app: snapshot-generator
    component: cache-prewarmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snapshot-generator
  template:
    metadata:
      labels:
        app: snapshot-generator
        component: cache-prewarmer
    spec:
      containers:
      - name: snapshot-generator
        image: snapshot-generator:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: billing-config
        - secretRef:
            name: billing-secret
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1536Mi"
        ports:
        - containerPort: 8082
          name: http
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: snapshot-generator-service
  namespace: evn-billing
spec:
  type: NodePort
  selector:
    app: snapshot-generator
  ports:
  - port: 8082
    targetPort: 8082
    nodePort: 30082
    name: http
