apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-mediation
  namespace: evn-billing
  labels:
    app: billing-mediation
    component: mediation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-mediation
  template:
    metadata:
      labels:
        app: billing-mediation
    spec:
      containers:
      - name: billing-mediation
        image: mediation-service:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: billing-config
        - secretRef:
            name: billing-secret
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1536Mi"
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: billing-mediation-service
  namespace: evn-billing
spec:
  type: NodePort
  selector:
    app: billing-mediation
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
