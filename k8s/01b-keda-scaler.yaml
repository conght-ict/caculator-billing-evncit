apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: billing-worker-keda-scaler
  namespace: evn-billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-worker
  minReplicaCount: 4
  maxReplicaCount: 32
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: host.docker.internal:9092
      consumerGroup: billing-worker-group
      topic: billing-execution-topic
      lagThreshold: "1000"
